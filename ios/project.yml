name: Dogear
options:
  bundleIdPrefix: com.walkerberryman
  deploymentTarget:
    iOS: "17.0"
attributes:
  LastUpgradeCheck: "2630"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Dogear:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "Dogear.xcodeproj"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Dogear
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - PlayfairDisplay-Bold.ttf
          - PlayfairDisplay-Regular.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkerberryman.dogear
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U6U59A7GGT
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
