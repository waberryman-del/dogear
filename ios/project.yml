name: Dogear
options:
  bundleIdPrefix: com.walkerberryman
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Dogear:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "Dogear.xcodeproj"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Dogear
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkerberryman.dogear
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
